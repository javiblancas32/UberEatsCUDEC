<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Pedidos - La Parada de Javi</title>

  <!-- PWA -->
  <meta name="theme-color"
        content="#FF8816">

  <link rel="manifest"
        href="./manifest.json">

  <!-- Materialize -->
  <link rel="stylesheet"
        href="./css/materialize.min.css">

  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
        rel="stylesheet">

  <!-- Leaflet -->
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <!-- CSS -->
  <link rel="stylesheet"
        href="./css/styles.css">

</head>

<body class="grey lighten-4">

  <nav class="z-depth-0">

    <div class="nav-wrapper container">

      <a href="./">
        La Parada <span>de Javi</span>
      </a>

      <a href="./"
         class="right btn white orange-text">

        <i class="material-icons left">
          arrow_back
        </i>

        Regresar

      </a>

    </div>

  </nav>

  <div class="container">

    <h4 class="center">
      Nuevo Pedido
    </h4>

    <form id="formPedido">

      <!-- NOMBRE -->
      <div class="input-field">

        <input type="text"
               id="nombre"
               required>

        <label for="nombre">
          Nombre del cliente
        </label>

      </div>

      <!-- DIRECCIÓN -->
      <div class="input-field">

        <input type="text"
               id="direccion"
               required>

        <label for="direccion">
          Dirección
        </label>

      </div>

      <!-- PLATILLO -->
      <div class="input-field">

        <select id="platillo"
                required>

          <option value=""
                  disabled
                  selected>

            Seleccione un platillo

          </option>

        </select>

        <label>
          Platillo
        </label>

      </div>

      <!-- COORDENADAS -->
      <input type="hidden"
             id="latitud">

      <input type="hidden"
             id="longitud">

      <!-- UBICACIÓN -->
      <button type="button"
              id="btnUbicacion"
              class="btn blue">

        <i class="material-icons left">
          location_on
        </i>

        Obtener ubicación

      </button>

      <!-- MAPA -->
      <div id="mapa"></div>

      <br>

      <!-- GUARDAR -->
      <button type="submit"
              class="btn green">

        <i class="material-icons left">
          save
        </i>

        Guardar Pedido

      </button>

    </form>

  </div>

  <!-- FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/6.0.1/firebase-app.js"></script>

  <script src="https://www.gstatic.com/firebasejs/6.0.1/firebase-firestore.js"></script>

  <script src="./js/firebase.js"></script>

  <!-- LEAFLET -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- MATERIALIZE -->
  <script src="./js/materialize.min.js"></script>

  <!-- PEDIDOS -->
  <script src="./js/pedidos.js"></script>

  <!-- SERVICE WORKER -->
  <script>

    if ("serviceWorker" in navigator) {

      window.addEventListener("load", function () {

        navigator.serviceWorker.register("./sw.js");

      });

    }

  </script>

</body>

</html>
