<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Pedidos - La Parada de Javi</title>

  <meta name="theme-color"
        content="#FF8816">

  <link rel="manifest"
        href="./manifest.json">

  <link rel="stylesheet"
        href="./css/materialize.min.css">

  <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
        rel="stylesheet">

  <!-- LEAFLET -->

  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <link rel="stylesheet"
        href="./css/styles.css">

</head>


<body class="grey lighten-4">


  <!-- =========================
       NAVEGACIÓN
  ========================== -->

  <nav class="z-depth-0">

    <div class="nav-wrapper container">

      <a href="./">
        La Parada <span>de Javi</span>
      </a>


      <span class="right grey-text text-darken-1">

        <i class="material-icons sidenav-trigger"
           data-target="side-menu">
          menu
        </i>

      </span>

    </div>

  </nav>


  <!-- =========================
       MENÚ LATERAL
  ========================== -->

  <ul id="side-menu"
      class="sidenav side-menu">

    <li>

      <a class="subheader">
        LA PARADA DE JAVI
      </a>

    </li>


    <li>

      <a href="./"
         class="waves-effect">

        <i class="material-icons">
          home
        </i>

        Home

      </a>

    </li>


    <li>

      <a href="./pedidos.html"
         class="waves-effect">

        <i class="material-icons">
          shopping_cart
        </i>

        Pedidos

      </a>

    </li>


    <li>

      <a href="./pages/about.html"
         class="waves-effect">

        <i class="material-icons">
          info_outline
        </i>

        About

      </a>

    </li>


    <li>
      <div class="divider"></div>
    </li>


    <li>

      <a href="./pages/contact.html"
         class="waves-effect">

        <i class="material-icons">
          mail_outline
        </i>

        Contacto

      </a>

    </li>

  </ul>


  <!-- =========================
       CONTENIDO
  ========================== -->

  <div class="container">

    <h4 class="center">
      Nuevo Pedido
    </h4>


    <form id="formPedido">


      <!-- NOMBRE -->

      <div class="input-field">

        <input type="text"
               id="nombre"
               required>

        <label for="nombre">
          Nombre del cliente
        </label>

      </div>


      <!-- DIRECCIÓN -->

      <div class="input-field">

        <input type="text"
               id="direccion"
               required>

        <label for="direccion">
          Dirección
        </label>

      </div>


      <!-- PLATILLO -->

      <div class="input-field">

        <select id="platillo"
                required>

          <option value=""
                  disabled
                  selected>

            Seleccione un platillo

          </option>

        </select>

        <label>
          Platillo
        </label>

      </div>


      <!-- COORDENADAS -->

      <input type="hidden"
             id="latitud">

      <input type="hidden"
             id="longitud">


      <!-- UBICACIÓN -->

      <button type="button"
              id="btnUbicacion"
              class="btn blue">

        <i class="material-icons left">
          location_on
        </i>

        Obtener ubicación

      </button>


      <!-- MAPA -->

      <div id="mapa"></div>


      <br>


      <!-- GUARDAR -->

      <button type="submit"
              class="btn green">

        <i class="material-icons left">
          save
        </i>

        Guardar Pedido

      </button>


    </form>

  </div>


  <!-- FIREBASE -->

  <script src="https://www.gstatic.com/firebasejs/6.0.1/firebase-app.js"></script>

  <script src="https://www.gstatic.com/firebasejs/6.0.1/firebase-firestore.js"></script>

  <script src="./js/firebase.js"></script>


  <!-- LEAFLET -->

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


  <!-- MATERIALIZE -->

  <script src="./js/materialize.min.js"></script>


  <!-- MENÚ -->

  <script src="./js/menu.js"></script>


  <!-- PEDIDOS -->

  <script src="./js/pedidos.js"></script>


  <!-- SERVICE WORKER -->

  <script>

    if ("serviceWorker" in navigator) {

      window.addEventListener(
        "load",
        function () {

          navigator.serviceWorker
            .register("./sw.js");

        }
      );

    }

  </script>


</body>

</html>
