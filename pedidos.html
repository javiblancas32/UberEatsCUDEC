<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pedidos</title>

    <!-- Materialize -->
    <link rel="stylesheet" href="/css/materialize.min.css">

    <!-- Iconos Material -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- Leaflet -->
    <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body {
            padding-bottom: 50px;
        }

        .container {
            margin-top: 40px;
        }

        #btnUbicacion {
            margin-top: 20px;
            margin-bottom: 20px;
        }

        #mapa {
            width: 100%;
            height: 350px;
            margin-top: 20px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
    </style>

</head>

<body class="grey lighten-4">

    <nav class="blue">
        <div class="nav-wrapper container">

            <a href="/" class="brand-logo">
                La Parada de Javi
            </a>

            <a href="/" class="right btn white blue-text">
                <i class="material-icons left"></i>
                Regresar
            </a>

        </div>
    </nav>

    <div class="container">

        <h4 class="center">
            Nuevo Pedido
        </h4>

        <form id="formPedido">

            <!-- Nombre -->
            <div class="input-field">
                <input
                    type="text"
                    id="nombre"
                    required>

                <label for="nombre">
                    Nombre del cliente
                </label>
            </div>

            <!-- Dirección -->
            <div class="input-field">
                <input
                    type="text"
                    id="direccion"
                    required>

                <label for="direccion">
                    Dirección
                </label>
            </div>

            <!-- Platillo -->
            <div class="input-field">

                <select id="platillo" required>

                    <option value="" disabled selected>
                        Seleccione un platillo
                    </option>

                </select>

                <label>Platillo</label>

            </div>

            <!-- Coordenadas ocultas -->
            <input type="hidden" id="latitud">
            <input type="hidden" id="longitud">

            <!-- Botón ubicación -->
            <button
                type="button"
                id="btnUbicacion"
                class="btn blue">

                <i class="material-icons left"></i>

                Obtener ubicación

            </button>

            <!-- MAPA -->
            <div id="mapa"></div>

            <br>

            <!-- Guardar -->
            <button
                type="submit"
                class="btn green">

                <i class="material-icons left"></i>

                Guardar Pedido

            </button>

        </form>

    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/6.0.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/6.0.1/firebase-firestore.js"></script>

    <!-- Firebase -->
    <script src="/js/firebase.js"></script>
    <script src="/js/db.js"></script>

    <!-- Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Materialize -->
    <script src="/js/materialize.min.js"></script>

    <!-- Tu código -->
    <script src="/js/pedidos.js"></script>

</body>

</html>
